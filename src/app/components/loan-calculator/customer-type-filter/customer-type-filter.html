<div class="bank-filter-panel">

  <h6 class="filter-title">
    Müşteri Tipi
  </h6>


  <div class="divider"></div>


  <div class="bank-scroll-list">

    <label
      class="bank-item"
      *ngFor="let ct of customerTypes()">

      <input
        type="checkbox"
        [checked]="
          selectedCustomerTypeId() === ct.id
        "
        (change)="selectCustomerType(ct.id)">

      <span>
        {{ ct.name }}
      </span>

    </label>

  </div>

</div>
