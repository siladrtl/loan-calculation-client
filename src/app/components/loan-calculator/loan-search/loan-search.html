<!-- KREDİ TÜRLERİ -->

<div class="row mb-4">

  <div
    class="col-md-4"
    *ngFor="let type of loanTypes()">

    <div
      class="card text-center p-4 loan-card"
      [class.selected]="selectedLoanTypeId() === type.id"
      (click)="selectLoanType(type.id)">

      <h4 class="mt-3">
        {{ type.name }}
      </h4>

    </div>

  </div>

</div>


<!-- KREDİ TUTARI -->

<div class="mb-3">

  <label class="form-label">
    Kredi Tutarı
  </label>

  <input
    type="number"
    class="form-control theme-input"
    placeholder="Örneğin 100000"
    [(ngModel)]="loanAmount">

</div>


<!-- VADE -->

<div class="mb-4">

  <label class="form-label">
    Vade
  </label>

  <select
    class="form-select theme-input"
    [(ngModel)]="maturity">

    <option [ngValue]="12">12 Ay</option>
    <option [ngValue]="24">24 Ay</option>
    <option [ngValue]="36">36 Ay</option>
    <option [ngValue]="48">48 Ay</option>
    <option [ngValue]="60">60 Ay</option>

  </select>

</div>


<!-- ARAMA BUTONU -->

<button
  type="button"
  class="btn btn-theme-primary w-100"
  (click)="search()">

  Kredileri Listele

</button>
